<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IGLOO // Scroll 3D Assembly</title>
  <meta name="description" content="3D Igloo scroll assembly experience matching igloo.inc" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- WebGL Canvas Container -->
  <div id="webgl-container"></div>

  <!-- Scroll Height Spacer -->
  <div id="scroll-spacer"></div>

  <!-- Minimal Sleek HUD Overlay matching screen recording -->
  <div id="hud-container" class="hud-container">
    <!-- Top Header Bar -->
    <header class="hud-header">
      <!-- Top Left Branding -->
      <div class="brand-hero">
        <div class="brand-title">IGLOO</div>
        <div class="brand-sub">// Copyright © 2026</div>
        <div class="brand-info">Igloo, Inc.<br>All Rights Reserved.</div>
      </div>

      <!-- Top Right Manifesto -->
      <div class="manifesto-box">
        <div class="manifesto-title">////// Manifesto</div>
        <div class="manifesto-body">
          Our mission is to build the next generation of consumer brands at the intersection of Community, AI, and crypto.
        </div>
      </div>
    </header>

    <!-- Bottom Left Hint -->
    <div class="bottom-left-hint">
      <div>Scroll down to discover.</div>
      <div class="sound-badge">🔊 Sound: Off</div>
    </div>

    <!-- Right Side Interactive Mouse Scroll Tracker -->
    <div class="scroll-tracker" id="scroll-tracker">
      <div class="tracker-line-bg" id="tracker-line-bg">
        <div id="tracker-line-fill" class="tracker-line-fill"></div>
      </div>
      <div id="scroll-percent-badge" class="scroll-percent-badge">100%</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
